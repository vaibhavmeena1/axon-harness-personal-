name: Release CLI

# GitHub Releases are repository-wide. Every component in this monorepo
# namespaces its tags; this workflow only handles `cli-<version>` tags and
# exits early for anything else.
#
# Each macOS target is compiled and smoke-tested on its own native runner. The
# publish job uploads nothing until every target has built, so a release never
# carries a partial set of binaries.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing pre-release tag to rebuild, for example cli-0.2.0
        required: true
        type: string
      replace_assets:
        description: Explicitly replace existing release assets during recovery
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

env:
  BUN_VERSION: 1.4.1
  CLI_DIR: apps/cli
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
  RELEASE_OUTPUT_DIR: release
  RELEASE_SERVICE_ENVIRONMENT: production
  REPLACE_ASSETS: ${{ github.event_name == 'workflow_dispatch' && inputs.replace_assets && 'true' || 'false' }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    if: startsWith(github.event.release.tag_name || inputs.release_tag, 'cli-')
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-26
            host: Darwin-arm64
            lipo_arch: arm64
          - target: darwin-x64
            runner: macos-26-intel
            host: Darwin-x86_64
            lipo_arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    environment: production
    defaults:
      run:
        working-directory: apps/cli
    env:
      AXON_SERVICE_ORIGIN: ${{ vars.AXON_SERVICE_ORIGIN }}
      BUILD_TARGET: ${{ matrix.target }}
      RELEASE_BINARY_PATH: dist/axon-${{ matrix.target }}
      RELEASE_ARCHIVE_PATH: release/axon-${{ matrix.target }}.gz

    steps:
      - name: Check out exact release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Verify native ${{ matrix.target }} runner
        run: test "$(uname -s)-$(uname -m)" = "${{ matrix.host }}"

      - name: Derive CLI version from namespaced tag
        run: |
          case "$RELEASE_TAG" in
            cli-*) ;;
            *) echo "release tag must start with cli-: $RELEASE_TAG" >&2; exit 1 ;;
          esac
          printf 'RELEASE_VERSION=%s\n' "${RELEASE_TAG#cli-}" >> "$GITHUB_ENV"

      - name: Load release details for recovery run
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DETAILS_FILE: ${{ runner.temp }}/release.json
        run: gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > "$RELEASE_DETAILS_FILE"

      - name: Install workspace dependencies
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Validate release contract
        env:
          RELEASE_DETAILS_FILE: ${{ runner.temp }}/release.json
        run: bun run scripts/validate-release.ts

      - name: Verify tagged commit belongs to main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          TAGGED_COMMIT=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
          test "$(git rev-parse HEAD)" = "$TAGGED_COMMIT"
          git merge-base --is-ancestor "$TAGGED_COMMIT" refs/remotes/origin/main
          printf 'BUILD_COMMIT=%s\n' "$TAGGED_COMMIT" >> "$GITHUB_ENV"

      - name: Validate production service origin
        run: |
          bun -e '
            import { parseServiceOrigin } from "./src/product/service-origin.ts";
            const value = process.env.AXON_SERVICE_ORIGIN;
            if (value === undefined || value.trim() === "") throw new Error("AXON_SERVICE_ORIGIN must be set");
            parseServiceOrigin(value, { allowLoopbackHttp: false });
          '

      - name: Check formatting and lint across the workspace
        working-directory: .
        run: bunx biome ci .

      - name: Check telemetry bundle and types
        run: bun run check

      - name: Run all tests
        run: bun test

      - name: Check installer shell syntax
        run: sh -n install.sh

      - name: Compile production executable
        run: bun run build:release

      - name: Verify architecture
        run: |
          test "$(lipo -archs "$RELEASE_BINARY_PATH")" = "${{ matrix.lipo_arch }}"
          file "$RELEASE_BINARY_PATH"

      - name: Ad-hoc sign and verify executable
        run: |
          codesign --force --sign - --timestamp=none "$RELEASE_BINARY_PATH"
          codesign --verify --verbose=2 "$RELEASE_BINARY_PATH"

      - name: Smoke-test signed executable
        run: |
          test "$("$RELEASE_BINARY_PATH" --version)" = "$RELEASE_VERSION"
          "$RELEASE_BINARY_PATH" harnesses

      - name: Package reproducible archive
        run: |
          rm -rf "$RELEASE_OUTPUT_DIR"
          mkdir -p "$RELEASE_OUTPUT_DIR"
          COPYFILE_DISABLE=1 gzip -9 -n -c "$RELEASE_BINARY_PATH" > "$RELEASE_ARCHIVE_PATH"
          gzip -t "$RELEASE_ARCHIVE_PATH"
          cp "${RELEASE_BINARY_PATH}.map" "$RELEASE_OUTPUT_DIR/axon-${BUILD_TARGET}.map"

      # The signed binary travels with its archive so the publish job hashes both.
      - name: Hand off ${{ matrix.target }} build
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            apps/cli/dist/axon-${{ matrix.target }}
            apps/cli/release/axon-${{ matrix.target }}.gz
            apps/cli/release/axon-${{ matrix.target }}.map
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release assets
    needs: build
    runs-on: macos-26
    timeout-minutes: 15
    environment: production
    defaults:
      run:
        working-directory: apps/cli

    steps:
      - name: Check out exact release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Derive CLI version and commit from namespaced tag
        run: |
          printf 'RELEASE_VERSION=%s\n' "${RELEASE_TAG#cli-}" >> "$GITHUB_ENV"
          printf 'BUILD_COMMIT=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Collect every target's build
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          # `uses:` steps ignore the job's working-directory default.
          path: apps/cli

      - name: Refuse existing assets unless recovery replacement is explicit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          for asset in \
            axon-darwin-arm64.gz \
            axon-darwin-arm64.map \
            checksums-darwin-arm64.txt \
            axon-darwin-x64.gz \
            axon-darwin-x64.map \
            checksums-darwin-x64.txt \
            checksums.txt \
            release-metadata.json \
            VERSION \
            install.sh
          do
            if printf '%s\n' "$existing" | grep -Fqx "$asset" && [ "$REPLACE_ASSETS" != "true" ]; then
              echo "release asset already exists: $asset" >&2
              echo "Use a workflow_dispatch recovery run with replace_assets enabled only after reviewing the failed release." >&2
              exit 1
            fi
          done

      - name: Generate release metadata and checksums
        run: |
          cp install.sh "$RELEASE_OUTPUT_DIR/install.sh"
          cmp install.sh "$RELEASE_OUTPUT_DIR/install.sh"
          bun run release:metadata

      - name: Verify packaged hashes
        run: |
          for target in darwin-arm64 darwin-x64; do
            checksums="release/checksums-$target.txt"
            expected_archive=$(awk -v name="axon-$target.gz" '$2 == name { print $1 }' "$checksums")
            expected_binary=$(awk -v name="axon-$target" '$2 == name { print $1 }' "$checksums")
            test "$(shasum -a 256 "release/axon-$target.gz" | awk '{ print $1 }')" = "$expected_archive"
            test "$(gzip -dc "release/axon-$target.gz" | shasum -a 256 | awk '{ print $1 }')" = "$expected_binary"
          done
          # Launchers released before x64 support read only arm64 hashes from checksums.txt.
          cmp release/checksums.txt release/checksums-darwin-arm64.txt
          test "$(cat release/VERSION)" = "$RELEASE_VERSION"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -- \
            release/axon-darwin-arm64.gz \
            release/axon-darwin-arm64.map \
            release/checksums-darwin-arm64.txt \
            release/axon-darwin-x64.gz \
            release/axon-darwin-x64.map \
            release/checksums-darwin-x64.txt \
            release/checksums.txt \
            release/release-metadata.json \
            release/VERSION \
            release/install.sh
          if [ "$REPLACE_ASSETS" = "true" ]; then
            gh release upload "$RELEASE_TAG" --clobber "$@"
          else
            gh release upload "$RELEASE_TAG" "$@"
          fi

      - name: Attest release executable archives
        uses: actions/attest-build-provenance@v3
        with:
          # `uses:` steps ignore the job's working-directory default.
          subject-path: |
            apps/cli/release/axon-darwin-arm64.gz
            apps/cli/release/axon-darwin-x64.gz

      - name: Promote stable semantic versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version_without_build=${RELEASE_VERSION%%+*}
          case "$version_without_build" in
            *-*) echo "Keeping semantic pre-release $RELEASE_TAG marked as a GitHub pre-release." ;;
            *) gh release edit "$RELEASE_TAG" --prerelease=false --latest ;;
          esac
