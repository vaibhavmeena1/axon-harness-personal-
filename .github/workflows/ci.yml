name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.1

jobs:
  workspace:
    name: Workspace format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting and lint across every app
        run: bunx biome ci .

  cli:
    name: CLI checks (apps/cli)
    runs-on: macos-26
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/cli

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Verify Apple Silicon runner
        run: test "$(uname -s)-$(uname -m)" = "Darwin-arm64"

      - name: Install workspace dependencies
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Check telemetry bundle and types
        run: bun run check

      - name: Test launcher and installer
        run: bun test

      - name: Check installer shell syntax
        run: sh -n install.sh

      - name: Compile development binary
        run: bun run build

      - name: Smoke-test compiled binary
        run: |
          test "$(./dist/axon --version)" = "0.1.0-dev"
          ./dist/axon harnesses
          test "$(lipo -archs ./dist/axon)" = "arm64"
