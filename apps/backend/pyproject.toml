[project]
name = "axon-backend"
version = "0.1.6"
description = "Centralized management API for Axon CLI installations"
authors = [{ name = "1mg Backend Team", email = "backend-team@1mg.com" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.30.0",
    "boto3>=1.43.103",
    "cryptography>=50.0.1",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "opentelemetry-proto==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "tortoise-orm>=0.25.1",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=8.3.0",
    "ruff==0.14.10",
]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.uv]
package = false
