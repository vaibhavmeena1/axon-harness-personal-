# CLI binaries require native Apple Silicon: no CLI build or release runs here.
definitions:
  caches:
    bun: ~/.bun/install/cache
  steps:
    - step: &workspace-checks
        name: Workspace formatting and lint
        image: oven/bun:1.4.1
        max-time: 10
        caches:
          - bun
        script:
          - bun install --frozen-lockfile
          - bunx biome ci .

    - step: &cli-checks
        name: CLI checks (no native build)
        image: oven/bun:1.4.1
        max-time: 15
        caches:
          - bun
        script:
          - bun install --frozen-lockfile
          - cd apps/cli
          - bun run check
          # Installer integration tests need macOS outside a Docker container.
          - bun test tests/*.test.ts
          - sh -n install.sh

pipelines:
  branches:
    main: &ci
      - parallel:
          - step: *workspace-checks
          - step: *cli-checks
  pull-requests:
    '**': *ci
  custom:
    ci: *ci
